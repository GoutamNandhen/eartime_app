name: CI

on:
  push:
    branches: [main]
    tags: ['apk-*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eartime-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Pushing a tag like apk-<name> publishes the debug APK as a pre-release for direct phone install.
      - name: Publish pre-release APK
        if: startsWith(github.ref, 'refs/tags/apk-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk eartime-debug.apk
          gh release create "${GITHUB_REF_NAME}" eartime-debug.apk \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "EarTime test build (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA::7} for device testing. Debug-signed: not for distribution. Uninstall any flutter run build first."
