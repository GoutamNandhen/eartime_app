name: CI

on:
  push:
    branches: [main, 'codex/**']
    tags: ['apk-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # collector baseline guard reads commit 0a8be43

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Collector baseline guard
        shell: pwsh
        run: ./tools/check_collector_baseline.ps1 -AllowObserverLifecycleHooks

      - name: App version guard
        shell: pwsh
        run: ./tools/check_app_version.ps1

      - name: Public tree audit
        shell: pwsh
        run: ./tools/audit_public_tree.ps1

      # flutter build generates the Gradle wrapper (not committed) before the native tests run.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Native unit tests and release Kotlin compile
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: build/app/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eartime-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Pushing a tag like apk-<name> publishes the debug APK as a pre-release for direct phone install.
      - name: Publish pre-release APK
        if: startsWith(github.ref, 'refs/tags/apk-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk eartime-debug.apk
          gh release create "${GITHUB_REF_NAME}" eartime-debug.apk \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "EarTime test build (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA::7} for device testing. Debug-signed: not for distribution. Uninstall any older EarTime build first."
